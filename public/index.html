Aquí está el nuevo código de jarvis.html con activación por voz:

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Asistente IA</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #00d4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            border: 2px solid #00d4ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            max-width: 600px;
        }
        h1 {
            font-size: 3em;
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px #00d4ff;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }
        .status-indicator {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            transition: all 0.3s;
        }
        .status-indicator.listening {
            background: linear-gradient(135deg, #00d4ff 0%, #0080ff 100%);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            animation: pulse 2s infinite;
        }
        .status-indicator.active {
            background: linear-gradient(135deg, #ff0000 0%, #ff6600 100%);
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
            animation: pulse 1s infinite;
        }
        .status-indicator.processing {
            background: linear-gradient(135deg, #ffaa00 0%, #ff6600 100%);
            box-shadow: 0 0 40px rgba(255, 170, 0, 0.6);
            animation: spin 2s linear infinite;
        }
        .status-indicator.speaking {
            background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.6);
            animation: pulse 0.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        #status {
            margin-top: 30px;
            font-size: 1.2em;
            min-height: 30px;
        }
        #transcript {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 10px;
            min-height: 100px;
            text-align: left;
            max-height: 400px;
            overflow-y: auto;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .user-message {
            background: rgba(0, 212, 255, 0.2);
            border-left: 3px solid #00d4ff;
        }
        .jarvis-message {
            background: rgba(0, 255, 136, 0.2);
            border-left: 3px solid #00ff88;
        }
        #startButton {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #00d4ff 0%, #0080ff 100%);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        #startButton:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>JARVIS</h1>
        <p class="subtitle">Just A Rather Very Intelligent System</p>
        
        <div id="indicator" class="status-indicator listening">🎤</div>
        
        <div id="status">Di "JARVIS" para activar</div>
        
        <button id="startButton">Iniciar Escucha Continua</button>
        
        <div id="transcript"></div>
    </div>

    <script>
        const indicator = document.getElementById('indicator');
        const status = document.getElementById('status');
        const transcript = document.getElementById('transcript');
        const startButton = document.getElementById('startButton');
        
        // IMPORTANTE: Reemplaza esta URL con la URL de tu webhook de n8n
        const WEBHOOK_URL = 'TU_URL_DE_WEBHOOK_AQUI';
        
        let recognition;
        let isListening = false;
        let isProcessing = false;
        let sessionId = localStorage.getItem('jarvis_session') || 'session_' + Date.now();
        localStorage.setItem('jarvis_session', sessionId);

        // Verificar soporte de reconocimiento de voz
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'es-ES';

            recognition.onstart = () => {
                isListening = true;
                indicator.className = 'status-indicator listening';
                status.textContent = 'Escuchando... Di "JARVIS" para activar';
            };

            recognition.onresult = (event) => {
                const current = event.resultIndex;
                const transcriptText = event.results[current][0].transcript.toLowerCase().trim();
                
                // Detectar palabra de activación "JARVIS"
                if (transcriptText.includes('jarvis') && !isProcessing) {
                    isProcessing = true;
                    indicator.className = 'status-indicator active';
                    status.textContent = '¡JARVIS activado! Escuchando tu pregunta...';
                    
                    // Esperar a que termine de hablar
                    setTimeout(() => {
                        const fullTranscript = Array.from(event.results)
                            .map(result => result[0].transcript)
                            .join(' ')
                            .replace(/jarvis/gi, '')
                            .trim();
                        
                        if (fullTranscript) {
                            sendTextToJarvis(fullTranscript);
                        }
                    }, 2000);
                }
            };

            recognition.onerror = (event) => {
                console.error('Error de reconocimiento:', event.error);
                if (event.error === 'no-speech') {
                    // Reiniciar si no detecta voz
                    if (isListening && !isProcessing) {
                        recognition.stop();
                        setTimeout(() => recognition.start(), 100);
                    }
                }
            };

            recognition.onend = () => {
                // Reiniciar automáticamente si no está procesando
                if (isListening && !isProcessing) {
                    setTimeout(() => recognition.start(), 100);
                }
            };

            startButton.addEventListener('click', () => {
                if (!isListening) {
                    recognition.start();
                    startButton.textContent = 'Detener Escucha';
                    startButton.style.background = 'linear-gradient(135deg, #ff0000 0%, #ff6600 100%)';
                } else {
                    recognition.stop();
                    isListening = false;
                    startButton.textContent = 'Iniciar Escucha Continua';
                    startButton.style.background = 'linear-gradient(135deg, #00d4ff 0%, #0080ff 100%)';
                    indicator.className = 'status-indicator';
                    status.textContent = 'Escucha detenida';
                }
            });
        } else {
            status.textContent = 'Tu navegador no soporta reconocimiento de voz';
            startButton.style.display = 'none';
        }

        async function sendTextToJarvis(userMessage) {
            try {
                indicator.className = 'status-indicator processing';
                status.textContent = 'JARVIS está pensando...';

                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_message: userMessage,
                        session_id: sessionId
                    })
                });

                const data = await response.json();
                
                // Mostrar transcripción del usuario
                const userDiv = document.createElement('div');
                userDiv.className = 'message user-message';
                userDiv.innerHTML = `<strong>Tú:</strong> ${userMessage}`;
                transcript.appendChild(userDiv);

                // Mostrar respuesta de JARVIS
                const jarvisDiv = document.createElement('div');
                jarvisDiv.className = 'message jarvis-message';
                jarvisDiv.innerHTML = `<strong>JARVIS:</strong> ${data.jarvis_response}`;
                transcript.appendChild(jarvisDiv);

                // Reproducir audio de respuesta
                if (data.audio_base64) {
                    indicator.className = 'status-indicator speaking';
                    status.textContent = 'JARVIS está hablando...';
                    
                    const audio = new Audio('data:audio/mp3;base64,' + data.audio_base64);
                    audio.play();
                    
                    audio.onended = () => {
                        isProcessing = false;
                        indicator.className = 'status-indicator listening';
                        status.textContent = 'Escuchando... Di "JARVIS" para activar';
                    };
                } else {
                    isProcessing = false;
                    indicator.className = 'status-indicator listening';
                    status.textContent = 'Escuchando... Di "JARVIS" para activar';
                }

                transcript.scrollTop = transcript.scrollHeight;
            } catch (error) {
                status.textContent = 'Error al comunicarse con JARVIS';
                console.error(error);
                isProcessing = false;
                indicator.className = 'status-indicator listening';
            }
        }
    </script>
</body>
</html>
